{% load static %}
<div class="new" id="new-reply">
    <div class="new__top">
        <p class="new__top-title m-0">Новое сообщение</p>
        <div class="new__top-btn new__top-btn-first">
            <img src="{% static 'mail/img/icons/new-1.png' %}" alt="" />
        </div>
        <div class="new__top-btn resize">
            <img src="{% static 'mail/img/icons/new-2.png' %}" alt="" />
        </div>
        <div class="new__top-btn" id="new-close">
            <img src="{% static 'mail/img/icons/new-3.png' %}" alt="" />
        </div>
    </div>
    <div class="new-container">
        <form action="#" method="post">
            {% csrf_token %}
            {{ form.user }}
            <div hidden>
                {{ form.category }}
            </div>
            {{ form.parent }}
            <div class="new__who">
                <p class="m-0 me-2">Кому</p>
                {{ form.recipients }}
            </div>
            <div class="new__who">
                <p class="m-0 me-2">От кого</p>
                {{ form.sender }}
            </div>
            {{ form.subject }}
            <div class="profile-name">
                {{ email.timestamp }}, {{ email.user.first_name }} &lt;{{ email.user.email }}>&gt;
            </div>
            {{ form.body }}

            <div class="new__bottom">
                <button class="new__bottom-send" type="submit">Отправить</button>

                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-1.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-2.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-3.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-4.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-5.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-6.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-7.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-8.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn">
                    <img src="{% static 'mail/img/icons/format-9.png' %}" alt="" />
                </div>
                <div class="new__bottom-btn ms-auto">
                    <img src="{% static 'mail/img/icons/format-10.png' %}" alt="" />
                </div>
            </div>
        </form>
    </div>
</div>
