{% extends 'mail/base.html' %}
{% load static %}

{% block content %}
<div id="mail" class="mail p-2">
    <div class="mail-content">
        <h2>{{ email.subject }}</h2>
        <div class="mail-content-user d-flex align-items-center justify-content-between">
            <img class='rounded-circle me-4' src="{% static 'mail/img/icons/profile.png' %}" alt="" />
            <div class="profile">
                <p class="profile-name m-0">
                     <span> &lt;{{ email.sender }}&gt; </span>
                </p>
                {% if email.sender == email.user.email %}
                <p class='m-0 profile-who'>кому: {{ email.recipients }}</p>
                {% else %}
                <p class='m-0 profile-who'>кому: мне</p>
                {% endif %}
            </div>
            <p class='user-date m-0 ms-auto me-2'>{{ email.timestamp }}</p>
            <button class="btn center-flex rounded-circle p-2">
                <img src="{% static 'mail/img/icons/start.png' %}" alt="" />
            </button>
            <button class="btn center-flex rounded-circle p-2">
                <img src="{% static 'mail/img/icons/format-4.png' %}" alt="" />
            </button>
            <button class="btn center-flex rounded-circle p-2">
                <img src="{% static 'mail/img/icons/reply.png' %}" alt="" />
            </button>
            <button class="btn center-flex rounded-circle p-2">
                <img src="{% static 'mail/img/icons/set.png' %}" alt="" />
            </button>
        </div>

        <div class='mail-text'>
            {{ email.body }}
        </div>

        <div class='mail-box'>
            <button class='mail-box-btn next'>
                <img src="{% static 'mail/img/icons/reply.png' %}" alt="">
                Ответить
            </button>
            <button class='mail-box-btn prev'>
                <img src="{% static 'mail/img/icons/reply-2.png' %}" alt="">
                Переслать
            </button>
            <button class='mail-box-btn smile'>
                <img src="{% static 'mail/img/icons/format-4.png' %}" alt="">
            </button>
        </div>
    </div>
</div>
{% endblock content %}
